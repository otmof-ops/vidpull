name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: verify the tag matches pyproject and the changelog
        run: |
          ver="${GITHUB_REF_NAME#v}"
          got="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          [ "$ver" = "$got" ] || { echo "tag $ver does not match pyproject version $got"; exit 1; }
          grep -q "^## \[$ver\] - " CHANGELOG.md || { echo "CHANGELOG.md has no [$ver] section"; exit 1; }
      - name: build
        run: |
          python -m pip install build
          scripts/build.sh
      - name: publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          notes="$(awk -v h="## [$ver]" 'index($0, h) == 1 {f = 1; next} /^## \[/ {f = 0} f' CHANGELOG.md)"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "vidpull $GITHUB_REF_NAME" --notes "$notes"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
